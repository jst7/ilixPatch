[package]
name = "ilixpatch-app"
description = "ilixPatch desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ilixpatch_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce.workspace = true
ilixpatch-core.workspace = true
ilixpatch-engine.workspace = true
ilixpatch-runner.workspace = true
ilixpatch-scripting.workspace = true
ilixpatch-git.workspace = true
ilixpatch-importer.workspace = true
ilixpatch-oauth2.workspace = true
ilixpatch-history.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde.workspace = true
indexmap.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
