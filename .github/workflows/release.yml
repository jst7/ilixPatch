name: Release

# Push a tag like v0.2.0 to build installers + CLI binaries for all platforms and
# create a DRAFT GitHub Release (review it, then publish it by hand).
#
# Optional code signing — add these repository secrets and they are picked up automatically:
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID   → signed + notarized .dmg/.app
#   Windows: configure `bundle.windows.signCommand` (e.g. Azure Trusted Signing) in tauri.conf.json
# Without them the installers are built unsigned (macOS Gatekeeper / Windows SmartScreen will warn).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Tag matches versions
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag with Cargo.toml and tauri.conf.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tauri_v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "tag=$tag cargo=$cargo_v tauri=$tauri_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$tauri_v" ] || { echo "::error::Version mismatch"; exit 1; }

  app:
    name: App (${{ matrix.name }})
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            targets: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            targets: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.targets }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        # Fail fast on mirror/DNS outages (a GitHub runner DNS failure once made apt retry for 35 min),
        # and retry the whole step a few times since those outages are usually transient.
        timeout-minutes: 15
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update && \
               sudo apt-get $APT_OPTS install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt failed (attempt $attempt/3), retrying in 30 s…"
            sleep 30
          done
          echo "::error::Could not install the Linux system dependencies (Ubuntu mirrors unreachable). Re-run the job later."
          exit 1
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      # Signing is OPTIONAL. A missing secret becomes an EMPTY env var in GitHub Actions, and Tauri
      # then tries to import an empty certificate / notarize with an empty Apple ID and fails.
      # So only export the variables whose secrets are actually set; otherwise build unsigned.
      - name: Configure macOS signing (only if secrets are set)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            echo "macOS code signing: enabled"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
              echo "macOS notarization: enabled"
            fi
          else
            echo "::notice::No Apple signing secrets: building an UNSIGNED macOS app (users must right-click > Open the first time)."
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: ilixPatch ${{ github.ref_name }}
          releaseBody: |
            See the assets below for installers (macOS .dmg, Windows .msi/.exe, Linux .deb/.rpm/.AppImage)
            and the `ilixpatch` CLI binaries. Third-party notices are included in every archive.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  cli:
    name: CLI (${{ matrix.target }})
    needs: [check-version]
    if: always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p ilixpatch-cli --target ${{ matrix.target }}
      - name: Package (binary + licenses)
        shell: bash
        run: |
          name="ilixpatch-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/ilixpatch${{ matrix.ext }}" "dist/$name/"
          cp README.md LICENSE* THIRD_PARTY_LICENSES "dist/$name/" 2>/dev/null || true
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/*.*
