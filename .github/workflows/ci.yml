name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        # Fail fast on mirror/DNS outages (a GitHub runner DNS failure once made apt retry for 35 min),
        # and retry the whole step a few times since those outages are usually transient.
        timeout-minutes: 15
        run: |
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            if sudo apt-get $APT_OPTS update && \
               sudo apt-get $APT_OPTS install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf; then
              exit 0
            fi
            echo "::warning::apt failed (attempt $attempt/3), retrying in 30 s…"
            sleep 30
          done
          echo "::error::Could not install the Linux system dependencies (Ubuntu mirrors unreachable). Re-run the job later."
          exit 1
      - name: Build frontend (needed by tauri::generate_context!)
        working-directory: app
        run: npm ci && npm run build
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace
      - name: THIRD_PARTY_LICENSES is up to date
        if: runner.os == 'Linux'
        run: node scripts/third-party-licenses.mjs --check

  frontend:
    name: Frontend (svelte-check + self-tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - name: svelte-check
        working-directory: app
        run: npm run check
      - name: Algorithm self-tests (merge, import, search)
        working-directory: app
        run: |
          node src/lib/merge/selftest.mjs
          node src/lib/import/selftest.mjs
          node src/lib/search/selftest.mjs

  cli-e2e:
    name: CLI end-to-end (demo project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the demo collection with Newman-style reporters
        run: |
          cargo run -q -p ilixpatch-cli -- run examples/demo-project --env dev \
            -r cli,junit --reporter-junit-export target/junit.xml
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: demo-junit
          path: target/junit.xml
