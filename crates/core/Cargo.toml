[package]
name = "ilixpatch-core"
description = "Data model, variable resolution and on-disk storage for ilixPatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
indexmap.workspace = true
thiserror.workspace = true
toml.workspace = true
# Edit collection.toml / folder.toml in place, keeping comments and formatting (D39).
toml_edit = "0.25"
# D60: secrets encrypted with a key wrapped by the master password.
aes-gcm = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
base64 = "0.22"
getrandom = "0.4"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
