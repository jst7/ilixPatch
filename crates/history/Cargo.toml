[package]
name = "ilixpatch-history"
description = "Local request/response history (SQLite) for ilixPatch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ilixpatch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# `bundled` compiles SQLite from source: no system library needed.
rusqlite = { version = "0.42", features = ["bundled"] }
# Pure-Rust deflate for large response bodies.
miniz_oxide = "0.9"

[dev-dependencies]
tempfile = "3"
