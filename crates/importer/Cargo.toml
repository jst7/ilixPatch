[package]
name = "ilixpatch-importer"
description = "Import Postman collections, environments and data dumps into ilixPatch projects"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ilixpatch-core.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
toml.workspace = true
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
# Pure-Rust deflate (zlib-rs) for Postman "Export data" dumps.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
