[package]
name = "ilixpatch-engine"
description = "HTTP execution engine for ilixPatch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ilixpatch-core.workspace = true
ilixpatch-auth.workspace = true
getrandom = "0.3"
ilixpatch-bodystore.workspace = true
# Extra features on top of the workspace set: OS root certificates, SOCKS
# proxies and the macOS system proxy configuration.
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "socks", "macos-system-configuration"] }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
base64 = "0.23"
sha2 = "0.11"
x509-parser = "0.18"
p12-keystore = "0.4"
pkcs8 = { version = "0.11", features = ["encryption", "std"] }
# Same version as reqwest's, to classify TLS errors (D36).
rustls = { version = "0.23", default-features = false }

# D46 phase 2: per-request DNS / connection timings (task-local + connector layer).
tokio = { workspace = true, features = ["net", "rt"] }
tower = { version = "0.5", default-features = false }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time"] }
tempfile = "3"
serde_json.workspace = true
md-5 = "0.11"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
