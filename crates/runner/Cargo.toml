[package]
name = "ilixpatch-runner"
description = "Collection runner (Newman-compatible) and load testing for ilixPatch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ilixpatch-core.workspace = true
ilixpatch-engine.workspace = true
ilixpatch-scripting.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
tokio-util = "0.7"
csv = "1"
hdrhistogram = { version = "7", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["time", "sync", "net", "io-util"] }
